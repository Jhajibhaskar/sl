<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Archive — Salesforce Lab</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header id="site-header"></header><div class="wrap" style="padding-top:50px;"><div class="eyebrow">Archive</div><h1>Every post, by month</h1><div id="archive-list" style="margin-top:30px;"></div></div><footer id="site-footer" style="margin-top:70px;"></footer><script src="assets/js/layout.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/store.js"></script><script>
(async function(){Layout.mount('archive');try{const posts=await Store.getPosts();const groups={};posts.forEach(p=>{const d=new Date(Number(p.publishedDate)||p.publishedDate),key=d.toLocaleDateString(undefined,{year:'numeric',month:'long'});(groups[key]=groups[key]||[]).push(p);});const list=document.getElementById('archive-list'),keys=Object.keys(groups);if(!keys.length){list.innerHTML=`<div class="empty-state"><h3>No posts published yet</h3></div>`;return;}list.innerHTML=keys.map(month=>`<div style="margin-bottom:36px;"><h2 style="font-size:1.1rem;color:var(--sky);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;">${Layout.escape(month)} <span style="color:var(--text-dim);">(${groups[month].length})</span></h2><div style="border-top:1px solid var(--line);margin-top:10px;">${groups[month].map(p=>`<a href="post.html?slug=${encodeURIComponent(p.slug)}" style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);"><span>${Layout.escape(p.title)}</span><span style="color:var(--text-dim);font-size:.85rem;white-space:nowrap;">${Layout.timeAgo(p.publishedDate)}</span></a>`).join('')}</div></div>`).join('');}catch(e){document.getElementById('archive-list').innerHTML=`<div class="empty-state"><h3>Archive unavailable</h3><p>${Layout.escape(e.message)}</p></div>`;}})();
</script></body></html>
