<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Search — Salesforce Lab</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header id="site-header"></header><div class="wrap" style="padding-top:50px;max-width:760px;"><div class="eyebrow">Search</div><h1>Find an article</h1><form id="search-form" style="display:flex;gap:10px;margin:20px 0 36px;"><input id="q" type="text" placeholder="Try “Queueable”, “Flow”, “Agentforce”…" autofocus><button class="btn btn-primary" type="submit" style="flex-shrink:0;">Search</button></form><div id="count-label" class="eyebrow" style="margin-bottom:16px;"></div><div id="results"></div></div><footer id="site-footer" style="margin-top:70px;"></footer><script src="assets/js/layout.js"></script><script src="assets/js/store.js"></script><script>
(async function(){Layout.mount();const params=new URLSearchParams(location.search),initialQ=params.get('q')||'';document.getElementById('q').value=initialQ;async function render(q){const results=document.getElementById('results'),count=document.getElementById('count-label');if(!q){results.innerHTML='';count.textContent='';return;}try{const posts=await Store.getPosts({q:q});count.textContent=`${posts.length} result${posts.length===1?'':'s'} for "${q}"`;if(!posts.length){results.innerHTML=`<div class="empty-state"><h3>No matches</h3><p>Try a different keyword or browse the archive.</p></div>`;return;}results.innerHTML=posts.map(p=>`<a href="post.html?slug=${encodeURIComponent(p.slug)}" style="display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);"><div style="flex:1;"><span class="cat-tag">${Layout.escape(p.category||'')}</span><h3 style="margin:6px 0 4px;">${Layout.escape(p.title)}</h3><p style="color:var(--text-dim);margin:0;">${Layout.escape(p.excerpt||'')}</p></div></a>`).join('');}catch(e){results.innerHTML=`<div class="empty-state"><h3>Search unavailable</h3><p>${Layout.escape(e.message)}</p></div>`;}}document.getElementById('search-form').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('q').value.trim();history.replaceState(null,'','search.html?q='+encodeURIComponent(q));render(q);});await render(initialQ);})();
</script></body></html>
