<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title id="page-title">Category — Salesforce Lab</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header id="site-header"></header><div class="wrap" style="padding-top:50px;"><div class="eyebrow">Category</div><h1 id="heading">—</h1><div class="pill-row" id="category-pills"></div><div class="section-head"><h2 id="count-label"></h2></div><div class="post-grid" id="post-grid"></div><div id="empty" class="empty-state" style="display:none;"><h3>Nothing here yet</h3><p>Check back once new posts are published in this category.</p></div></div><footer id="site-footer" style="margin-top:70px;"></footer><script src="assets/js/layout.js"></script><script src="assets/js/store.js"></script><script>
(async function(){Layout.mount();const cat=new URLSearchParams(location.search).get('cat')||'';document.getElementById('page-title').textContent=cat+' — Salesforce Lab';document.getElementById('heading').textContent=cat||'All categories';try{const cats=await Store.getCategories();document.getElementById('category-pills').innerHTML=cats.map(c=>`<a href="category.html?cat=${encodeURIComponent(c.name)}" class="pill ${c.name.toLowerCase()===cat.toLowerCase()?'active':''}">${Layout.escape(c.name)} · ${c.count}</a>`).join('');const posts=cat?await Store.getPosts({category:cat}):await Store.getPosts();document.getElementById('count-label').textContent=`${posts.length} post${posts.length===1?'':'s'}`;const grid=document.getElementById('post-grid');if(!posts.length){document.getElementById('empty').style.display='block';return;}grid.innerHTML=posts.map(p=>`<a class="card" href="post.html?slug=${encodeURIComponent(p.slug)}"><div class="fig">${p.image?`<img src="${Layout.escape(p.image)}" alt="">`:''}<span class="fig-cat">${Layout.escape(p.category||'')}</span></div><div class="body"><h3>${Layout.escape(p.title)}</h3><p>${Layout.escape(p.excerpt||'')}</p><div class="meta-row"><span>${Layout.timeAgo(p.publishedDate)}</span><span class="dot"></span><span>${p.readTime||5} min read</span></div></div></a>`).join('');}catch(e){document.getElementById('empty').style.display='block';document.getElementById('empty').querySelector('p').textContent=e.message;}})();
</script></body></html>
