<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Owner sign in — Salesforce Lab</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css"></head><body class="admin"><div class="login-box"><div class="brand" style="margin-bottom:22px;"><span class="mark">SF</span><span>Salesforce Lab</span></div><h2 style="font-size:1.2rem;">Owner sign in</h2><p class="hint" style="margin-top:8px;">Use the owner password configured in Google Apps Script. Public readers and contributors do not need an account here.</p><div class="field" style="margin-top:16px;"><label>Owner password</label><input id="login-pass" type="password" placeholder="••••••••"></div><button class="btn btn-primary" id="login-btn" style="width:100%;">Sign in</button><p id="status" class="hint" style="margin-top:12px;"></p><p style="margin-top:22px;"><a href="../index.html" style="color:var(--text-dim);font-size:.85rem;">← Back to site</a></p></div><script src="../assets/js/store.js"></script><script>
(async function(){const status=document.getElementById('status');try{const info=await Store.auth.status();if(!info.configured)status.textContent='Owner password is not configured yet. Run setup() and setOwnerPassword() in Apps Script.';}catch(e){status.textContent=e.message;}async function login(){status.textContent='Signing in…';try{await Store.auth.login(document.getElementById('login-pass').value);location.href='dashboard.html';}catch(e){status.textContent=e.message;status.style.color='#ff8a8a';}}document.getElementById('login-btn').addEventListener('click',login);document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});})();
</script></body></html>
