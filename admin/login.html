<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In — Salesforce Lab</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
  <div class="login-box">
    <div class="brand" style="margin-bottom:22px;">
      <span class="mark">SF</span><span>Salesforce Lab</span>
    </div>
    <h2 style="font-size:1.2rem;">Admin sign in</h2>
    <p class="hint" style="margin-top:8px;">
      Sign in with an approved Salesforce Lab admin account. Public readers and contributors do not need an account.
    </p>

    <div class="field" style="margin-top:16px;">
      <label>Email</label>
      <input id="login-email" type="email" autocomplete="username" placeholder="you@example.com">
    </div>

    <div class="field" style="margin-top:12px;">
      <label>Password</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="Your password">
    </div>

    <button class="btn btn-primary" id="login-btn" style="width:100%;margin-top:14px;">Sign in</button>
    <p id="status" class="hint" style="margin-top:12px;"></p>
    <p style="margin-top:22px;">
      <a href="../index.html" style="color:var(--text-dim);font-size:.85rem;">← Back to site</a>
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/store.js"></script>
<script>
(async function () {
  const status = document.getElementById('status');
  const btn = document.getElementById('login-btn');

  try {
    const info = await Store.auth.status();
    if (info.loggedIn && info.isAdmin) {
      location.href = 'dashboard.html';
      return;
    }
  } catch (e) {
    status.textContent = e.message;
    status.style.color = '#ff8a8a';
  }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;

    if (!email || !password) {
      status.textContent = 'Enter your email and password.';
      status.style.color = '#ff8a8a';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';
    status.textContent = '';

    try {
      await Store.auth.login(email, password);
      location.href = 'dashboard.html';
    } catch (e) {
      status.textContent = e.message;
      status.style.color = '#ff8a8a';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  btn.addEventListener('click', login);
  document.getElementById('login-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
  document.getElementById('login-email').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
})();
</script>
</body>
</html>
