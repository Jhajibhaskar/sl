<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editor — Salesforce Lab Admin</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css"></head><body class="admin"><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><span class="mark">SF</span><span>Salesforce Lab</span></div><nav><a href="dashboard.html">📊 Dashboard</a><a href="editor.html" class="active">✏️ New post</a><a href="review.html">📝 Contributor review</a><a href="../index.html" target="_blank">🌐 View site</a><a href="#" id="logout-link">🚪 Sign out</a></nav></aside><main class="admin-main"><div class="admin-topbar"><h1 style="font-size:1.4rem;margin:0;" id="page-heading">New post</h1><div style="display:flex;gap:10px;"><button class="btn btn-ghost" id="save-draft">Save draft</button><button class="btn btn-primary" id="publish">Publish</button></div></div><div class="editor-grid"><div><div class="field"><label>Title</label><input id="title" placeholder="Exploring File Processing Capabilities in Salesforce"></div><div class="field"><label>Slug</label><input id="slug" placeholder="auto-generated-from-title"></div><div class="field"><label>Excerpt</label><textarea id="excerpt" rows="2" placeholder="One or two sentences shown on cards and search results."></textarea></div><div class="field"><label>Body</label><div class="editor-toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-block="h2">H2</button><button type="button" data-block="h3">H3</button><button type="button" data-block="blockquote">”</button><button type="button" data-cmd="insertUnorderedList">•—</button><button type="button" id="btn-link">🔗</button><button type="button" id="btn-image">🖼</button><button type="button" id="btn-attachment">📎</button><button type="button" id="btn-code">💻</button><button type="button" id="btn-callout">💡</button></div><div id="canvas" class="editor-canvas" contenteditable="true"></div><input type="file" id="inline-image-input" accept="image/*" style="display:none;"><input type="file" id="attachment-input" accept="application/pdf,text/markdown,.pdf,.md" style="display:none;"></div></div><div><div class="side-panel" style="margin-bottom:18px;"><label>Featured image</label><div class="img-preview" id="img-preview">No image</div><input type="file" id="featured-image-input" accept="image/*"><p class="hint">Images are uploaded to your Google Drive library, not browser storage.</p></div><div class="side-panel" style="margin-bottom:18px;"><div class="field" style="margin-bottom:14px;"><label>Category</label><select id="category"><option>Apex</option><option>Flow</option><option>Agentforce</option><option>Data Cloud</option><option>Integrations</option><option>LWC</option><option>Security</option><option>DevOps</option><option>Salesforce AI</option><option>Other</option></select></div><div class="field" style="margin-bottom:14px;"><label>Tags (comma separated)</label><input id="tags" placeholder="Apex, Async, Best Practices"></div><div class="field" style="margin-bottom:14px;"><label>Difficulty</label><select id="difficulty"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field"><label>Read time (minutes)</label><input id="readtime" type="number" min="1" value="5"></div></div><button class="btn btn-danger" id="delete-btn" style="width:100%;display:none;">Delete post</button></div></div></main></div><script src="../assets/js/store.js"></script><script>
(async function(){if(!await Store.auth.ensure())return;document.getElementById('logout-link').addEventListener('click',e=>{e.preventDefault();Store.auth.logout();location.href='login.html';});const id=new URLSearchParams(location.search).get('id');let current=id?await Store.getPostById(id):null;let featuredImage=current?(current.image||''):'';if(current){document.getElementById('page-heading').textContent='Edit post';document.getElementById('title').value=current.title||'';document.getElementById('slug').value=current.slug||'';document.getElementById('excerpt').value=current.excerpt||'';document.getElementById('canvas').innerHTML=current.content||'';document.getElementById('category').value=current.category||'Apex';document.getElementById('tags').value=(current.tags||[]).join(', ');document.getElementById('difficulty').value=current.difficulty||'Beginner';document.getElementById('readtime').value=current.readTime||5;document.getElementById('delete-btn').style.display='block';updatePreview();}
let slugTouched=!!(current&&current.slug);document.getElementById('slug').addEventListener('input',()=>slugTouched=true);document.getElementById('title').addEventListener('input',e=>{if(!slugTouched)document.getElementById('slug').value=Store.slugify(e.target.value);});document.querySelectorAll('[data-cmd]').forEach(btn=>btn.addEventListener('click',()=>{document.getElementById('canvas').focus();document.execCommand(btn.dataset.cmd);}));document.querySelectorAll('[data-block]').forEach(btn=>btn.addEventListener('click',()=>{document.getElementById('canvas').focus();document.execCommand('formatBlock',false,btn.dataset.block);}));document.getElementById('btn-link').addEventListener('click',()=>{const url=prompt('Link URL (https://…)');if(url){document.getElementById('canvas').focus();document.execCommand('createLink',false,url);}});document.getElementById('btn-code').addEventListener('click',()=>{document.getElementById('canvas').focus();document.execCommand('insertHTML',false,'<pre><code>Your code here</code></pre><p><br></p>');});document.getElementById('btn-image').addEventListener('click',()=>document.getElementById('inline-image-input').click());document.getElementById('btn-attachment').addEventListener('click',()=>document.getElementById('attachment-input').click());document.getElementById('btn-callout').addEventListener('click',()=>{document.getElementById('canvas').focus();document.execCommand('insertHTML',false,'<div class="callout"><strong>Key takeaway:</strong> Say the one thing you want a skimmer to remember.</div><p><br></p>');});
function fileToDataUrl(file){return new Promise((resolve,reject)=>{if(file.size>3500000){reject(new Error('Keep images under about 3.5 MB.'));return;}const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
async function uploadAndReturn(file){const data=await fileToDataUrl(file);const result=await Store.uploadImage(data,file.name);if(typeof result!=='string'||!/^https?:\/\/(drive\.google\.com|lh3\.googleusercontent\.com)\//i.test(result)){throw new Error('Image upload did not return a Google Drive URL.');}return result;}
function fileToDataUrlAny(file){return new Promise((resolve,reject)=>{if(file.size>8000000){reject(new Error('Keep PDF/Markdown attachments under 8 MB.'));return;}const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
async function uploadAsset(file){const data=await fileToDataUrlAny(file);return Store.uploadAsset(data,file.name);}
document.getElementById('inline-image-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const url=await uploadAndReturn(file);document.getElementById('canvas').focus();document.execCommand('insertHTML',false,`<p><img src="${url}" alt=""></p><p><br></p>`);}catch(err){alert(err.message);}e.target.value='';});document.getElementById('attachment-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(ext!=='pdf'&&ext!=='md'){alert('Only PDF and Markdown (.md) files are supported.');e.target.value='';return;}try{const url=await uploadAsset(file);document.getElementById('canvas').focus();const label=ext==='pdf'?'PDF document':'Markdown file';document.execCommand('insertHTML',false,`<div class="attachment-card"><div class="attachment-icon">${ext==='pdf'?'📄':'📝'}</div><div class="attachment-meta"><a href="${url}" target="_blank" rel="noopener">${file.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</a><div class="attachment-type">${label} · Opens in a new tab</div></div></div><p><br></p>`);}catch(err){alert(err.message);}e.target.value='';});
function updatePreview(){document.getElementById('img-preview').innerHTML=featuredImage?`<img src="${featuredImage}" alt="">`:'No image';}document.getElementById('featured-image-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{featuredImage=await uploadAndReturn(file);updatePreview();}catch(err){alert(err.message);}e.target.value='';});
function buildPost(status){return {id:current?current.id:undefined,title:document.getElementById('title').value.trim(),slug:document.getElementById('slug').value.trim(),excerpt:document.getElementById('excerpt').value.trim(),content:document.getElementById('canvas').innerHTML,image:featuredImage,category:document.getElementById('category').value,tags:document.getElementById('tags').value.split(',').map(t=>t.trim()).filter(Boolean),difficulty:document.getElementById('difficulty').value,readTime:parseInt(document.getElementById('readtime').value,10)||5,author:current?current.author:'Owner',status};}
async function save(status){const post=buildPost(status);if(!post.title){alert('Give the post a title first.');return;}try{await Store.savePost(post);location.href='dashboard.html';}catch(err){alert('Could not save: '+err.message);}}document.getElementById('save-draft').addEventListener('click',()=>save('draft'));document.getElementById('publish').addEventListener('click',()=>save('published'));document.getElementById('delete-btn').addEventListener('click',async()=>{if(current&&confirm('Delete this post permanently?')){try{await Store.deletePost(current.id);location.href='dashboard.html';}catch(e){alert(e.message);}}});})();
</script></body></html>
