<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contributor Review — Salesforce Lab</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css"><link rel="stylesheet" href="../assets/css/article.css"></head><body class="admin"><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><span class="mark">SF</span><span>Salesforce Lab</span></div><nav><a href="dashboard.html">📊 Dashboard</a><a href="editor.html">✏️ New post</a><a href="review.html" class="active">📝 Contributor review</a><a href="../index.html" target="_blank">🌐 View site</a><a href="#" id="logout-link">🚪 Sign out</a></nav></aside><main class="admin-main"><div class="admin-topbar"><h1 style="font-size:1.4rem;margin:0;">Contributor review</h1><a href="dashboard.html" class="btn btn-ghost">← Dashboard</a></div><div id="root"></div></main></div><script src="../assets/js/store.js"></script><script src="../assets/js/layout.js"></script><script>
(async function(){if(!await Store.auth.ensure())return;document.getElementById('logout-link').addEventListener('click',e=>{e.preventDefault();Store.auth.logout();location.href='login.html';});const id=new URLSearchParams(location.search).get('id');const root=document.getElementById('root');try{const subs=await Store.getSubmissions();const s=subs.find(x=>x.id===id);if(!s)throw new Error('Submission not found.');root.innerHTML=`<div class="side-panel"><span class="cat-tag">${Layout.escape(s.category||'')}</span><h1 style="margin:12px 0 8px;">${Layout.escape(s.title)}</h1><div class="meta-row"><span>By ${Layout.escape(s.name)}</span><span class="dot"></span><span>${Layout.escape(s.email||'No email')}</span><span class="dot"></span><span>${Layout.timeAgo(s.submittedDate)}</span></div>${s.image?`<img class="article-hero-img" src="${Layout.escape(s.image)}" alt="" style="margin-top:18px;">`:''}</div><div class="side-panel" style="margin-top:18px;"><h3>Excerpt</h3><p>${Layout.escape(s.excerpt||'')}</p><h3 style="margin-top:22px;">Article</h3><div class="article-body" style="padding:0;max-width:none;">${Layout.sanitizeHTML(s.content)}</div></div><div class="side-panel" style="margin-top:18px;"><label>Notes to contributor (optional)</label><textarea id="notes" rows="4" placeholder="Explain changes or rejection reasons…"></textarea><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;"><button class="btn btn-primary" id="approve">Approve & publish</button><button class="btn btn-ghost" id="changes">Request changes</button><button class="btn btn-danger" id="reject">Reject</button></div><p class="hint" style="margin-top:10px;">Approval creates a public post under the contributor's name. Request changes keeps it out of the public site.</p></div>`;async function review(decision){try{await Store.reviewSubmission(id,decision,document.getElementById('notes').value);location.href='dashboard.html';}catch(e){alert(e.message);}}document.getElementById('approve').addEventListener('click',()=>review('approve'));document.getElementById('changes').addEventListener('click',()=>review('changes'));document.getElementById('reject').addEventListener('click',()=>review('reject'));}catch(e){root.innerHTML=`<div class="empty-state"><h3>Could not load submission</h3><p>${Layout.escape(e.message)}</p></div>`;}})();
</script></body></html>
