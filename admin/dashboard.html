<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard — Salesforce Lab Admin</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css"></head><body class="admin"><div class="admin-shell"><aside class="admin-sidebar"><div class="brand"><span class="mark">SF</span><span>Salesforce Lab</span></div><nav><a href="dashboard.html" class="active">📊 Dashboard</a><a href="editor.html">✏️ New post</a><a href="review.html">📝 Contributor review</a><a href="../submit.html" target="_blank">🌍 Submission form</a><a href="../index.html" target="_blank">🌐 View site</a><a href="#" id="logout-link">🚪 Sign out</a></nav></aside><main class="admin-main"><div class="admin-topbar"><h1 style="font-size:1.4rem;margin:0;">Dashboard</h1><a href="editor.html" class="btn btn-primary">+ New post</a></div><div class="stat-row"><div class="stat-card"><div class="num" id="stat-published">0</div><div class="lbl">Published</div></div><div class="stat-card"><div class="num" id="stat-drafts">0</div><div class="lbl">Drafts</div></div><div class="stat-card"><div class="num" id="stat-pending">0</div><div class="lbl">Pending submissions</div></div><div class="stat-card"><div class="num" id="stat-views">0</div><div class="lbl">Total views</div></div></div><h2 style="font-size:1.05rem;">Contributor submissions</h2><div id="pending-list"></div><h2 style="font-size:1.05rem;margin-top:34px;">All posts</h2><div id="post-list"></div><div id="empty" class="empty-state" style="display:none;"><h3>No posts yet</h3><p>Create your first article.</p></div><div id="error" class="empty-state" style="display:none;"></div></main></div><script src="../assets/js/store.js"></script><script>
(async function(){if(!await Store.auth.ensure())return;document.getElementById('logout-link').addEventListener('click',e=>{e.preventDefault();Store.auth.logout();location.href='login.html';});const esc= s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function render(){try{const [all,subs]=await Promise.all([Store.getAllPosts(),Store.getSubmissions()]);const pending=subs.filter(s=>s.status==='pending');document.getElementById('stat-published').textContent=all.filter(p=>p.status==='published').length;document.getElementById('stat-drafts').textContent=all.filter(p=>p.status!=='published').length;document.getElementById('stat-pending').textContent=pending.length;document.getElementById('stat-views').textContent=all.reduce((s,p)=>s+(Number(p.views)||0),0);document.getElementById('pending-list').innerHTML=pending.length?pending.map(s=>`<div class="post-row"><div class="info"><h4>${esc(s.title)}</h4><div class="meta-row"><span class="status-badge draft">pending</span><span class="dot"></span><span>By ${esc(s.name)}</span><span class="dot"></span><span>${new Date(Number(s.submittedDate)||s.submittedDate).toLocaleDateString()}</span></div></div><a class="btn btn-ghost" href="review.html?id=${encodeURIComponent(s.id)}">Review</a></div>`).join(''):`<div class="empty-state"><h3>No pending submissions</h3><p>New contributor articles will appear here for approval.</p></div>`;const list=document.getElementById('post-list');all.sort((a,b)=>(Number(b.updatedDate)||0)-(Number(a.updatedDate)||0));document.getElementById('empty').style.display=all.length?'none':'block';list.innerHTML=all.map(p=>`<div class="post-row"><div class="info"><h4>${esc(p.title)}</h4><div class="meta-row"><span class="status-badge ${p.status==='published'?'published':'draft'}">${esc(p.status)}</span><span class="dot"></span><span>${esc(p.category||'Uncategorized')}</span><span class="dot"></span><span>${Number(p.views)||0} views</span><span class="dot"></span><span>By ${esc(p.author||'Owner')}</span></div></div><a class="btn btn-ghost" href="editor.html?id=${encodeURIComponent(p.id)}">Edit</a><button class="btn btn-ghost" data-toggle="${p.id}">${p.status==='published'?'Unpublish':'Publish'}</button><button class="btn btn-danger" data-delete="${p.id}">Delete</button></div>`).join('');list.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',async()=>{try{const post=all.find(p=>p.id===btn.dataset.toggle);post.status=post.status==='published'?'draft':'published';await Store.savePost(post);await render();}catch(e){alert(e.message);}}));list.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',async()=>{if(!confirm('Delete this post permanently?'))return;try{await Store.deletePost(btn.dataset.delete);await render();}catch(e){alert(e.message);}}));}catch(e){document.getElementById('error').style.display='block';document.getElementById('error').innerHTML=`<h3>Dashboard unavailable</h3><p>${esc(e.message)}</p>`;if(e.message.toLowerCase().includes('session')){Store.auth.logout();setTimeout(()=>location.href='login.html',500);}}}await render();})();
</script></body></html>
